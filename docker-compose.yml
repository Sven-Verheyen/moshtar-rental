# Lokale PostgreSQL-database voor ontwikkeling: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: moshtar
      POSTGRES_PASSWORD: moshtar
      POSTGRES_DB: moshtar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
